name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # The tests run outside Electron (the store mocks the module), so there
      # is no reason to download ~100 MB of binary on every run.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheapest gate first: this one fails in seconds and compiles nothing.
      - run: npm run format:check

      - run: npm run typecheck

      # The replay against a real recording skips itself here: there is no
      # %APPDATA%\dota-overlay\recorded.jsonl on a runner.
      - run: npm test

      - run: npm run build
